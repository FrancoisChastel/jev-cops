# rsyslog for the jev-cops live tests: TLS (RFC 5425) on 6514 with the throwaway
# certificate made by the entrypoint; copsd's messages written verbatim, one per line.
global(
  DefaultNetstreamDriver="gtls"
  DefaultNetstreamDriverCAFile="/etc/rsyslog-tls/ca.pem"
  DefaultNetstreamDriverCertFile="/etc/rsyslog-tls/cert.pem"
  DefaultNetstreamDriverKeyFile="/etc/rsyslog-tls/key.pem"
  maxMessageSize="1m"
  workDirectory="/var/lib/rsyslog"
)

module(load="imtcp" StreamDriver.Name="gtls" StreamDriver.Mode="1" StreamDriver.AuthMode="anon")
input(type="imtcp" port="6514")

template(name="raw" type="string" string="%rawmsg%\n")

if $app-name == "copsd" then {
  action(type="omfile" file="/var/log/remote/copsd.log" template="raw")
  stop
}
*.* action(type="omfile" file="/var/log/remote/other.log")
